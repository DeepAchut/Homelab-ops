name: Build mem0-server (2x test)

# Builds the mem0ai 2.x migration image as :2x (NOT :latest). Prod stays on
# :latest / mem0ai 0.1.118 until the data-compat test passes and we cut over.
# Multi-arch so the throwaway mem0-test deploy can run on the amd64 Evo-X2 worker
# (keeping load off the rpi4) while the same digest also covers the arm64 rpi4
# for the eventual production cutover.
on:
  push:
    paths:
      - docker/mem0-server-2x/**
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/mem0-server-2x
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/deepachut/mem0-server:2x
          cache-from: type=gha
          cache-to: type=gha,mode=max
