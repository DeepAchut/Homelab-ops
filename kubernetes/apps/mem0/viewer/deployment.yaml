apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0-viewer
  namespace: mem0
  labels: { app: mem0-viewer }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mem0-viewer }
  template:
    metadata:
      labels: { app: mem0-viewer }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - { containerPort: 8080, name: http }
          volumeMounts:
            - { name: web, mountPath: /usr/share/nginx/html/index.html, subPath: index.html }
            - { name: web, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "200m", memory: "64Mi" }
      volumes:
        # Hash-suffixed ConfigMap (configMapGenerator) — editing index.html/default.conf
        # rolls a new name and restarts the pod, so subPath mounts pick up changes.
        - name: web
          configMap:
            name: mem0-viewer-web
