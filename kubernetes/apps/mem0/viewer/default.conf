# nginx for the mem0 web viewer. Serves the static read-only UI and reverse-proxies
# /v1/ to the mem0-server API (same-origin -> no CORS). Listens on 8080 (unprivileged).
server {
    listen 8080;
    server_name _;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy the mem0 REST API (read paths used by the viewer: GET /v1/memories,
    # POST /v1/memories/search). Writes are not exposed by the UI.
    location /v1/ {
        proxy_pass http://mem0-server.mem0.svc.cluster.local:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
