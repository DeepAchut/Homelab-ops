<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mem0 · memory viewer</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1a1d21; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --chip: #eef2ff; --chip-fg: #3730a3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #171b22; --fg: #e6e8eb; --muted: #9aa4b2;
      --border: #2a2f3a; --accent: #5b8cff; --chip: #1e243a; --chip-fg: #aab6ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { position: sticky; top: 0; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 14px 20px; z-index: 5; }
  .title { font-size: 18px; font-weight: 650; }
  .title small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  input, select, button {
    font: inherit; padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--fg); }
  input[type=text] { flex: 1; min-width: 220px; }
  input#uid { max-width: 120px; }
  button { cursor: pointer; border-color: var(--accent); color: #fff; background: var(--accent); }
  button.ghost { background: var(--card); color: var(--fg); border-color: var(--border); }
  button:active { transform: translateY(1px); }
  main { max-width: 900px; margin: 0 auto; padding: 18px 20px 60px; }
  .status { color: var(--muted); font-size: 13px; margin: 6px 2px 14px; }
  .mem { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; }
  .mem .text { white-space: pre-wrap; word-break: break-word; }
  .mem .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
    font-size: 12px; color: var(--muted); align-items: center; }
  .chip { background: var(--chip); color: var(--chip-fg); border-radius: 999px;
    padding: 1px 9px; font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="title">mem0 <small>read-only memory viewer</small></div>
  <div class="controls">
    <input type="text" id="q" placeholder="Semantic search… (empty = list all)" autocomplete="off">
    <input type="text" id="uid" value="deep" title="user_id" aria-label="user_id">
    <button id="go">Search</button>
    <button id="all" class="ghost">List all</button>
  </div>
</header>
<main>
  <div class="status" id="status">Loading…</div>
  <div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const listEl = $('#list'), statusEl = $('#status');
const esc = s => (s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtDate = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString(); };

function render(items, {scored=false} = {}) {
  if (!items.length) { listEl.innerHTML = '<div class="empty">No memories.</div>'; return; }
  listEl.innerHTML = items.map(m => {
    const text = esc(m.memory || m.text || '');
    const bits = [];
    if (scored && typeof m.score === 'number') bits.push(`<span class="chip">${m.score.toFixed(3)}</span>`);
    const dt = fmtDate(m.created_at || m.updated_at);
    if (dt) bits.push(dt);
    if (m.id) bits.push(`<code>${esc(String(m.id).slice(0,8))}</code>`);
    return `<div class="mem"><div class="text">${text}</div>` +
           (bits.length ? `<div class="meta">${bits.join('')}</div>` : '') + `</div>`;
  }).join('');
}

function results(d) { return (d && Array.isArray(d.results)) ? d.results : (Array.isArray(d) ? d : []); }

async function listAll() {
  const uid = $('#uid').value.trim() || 'deep';
  statusEl.textContent = 'Loading all memories…';
  try {
    const r = await fetch(`/v1/memories?user_id=${encodeURIComponent(uid)}&limit=5000`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const items = results(await r.json());
    render(items);
    statusEl.textContent = `${items.length} memories for user_id="${uid}"`;
  } catch (e) { statusEl.textContent = 'Error: ' + e.message; }
}

async function search() {
  const uid = $('#uid').value.trim() || 'deep';
  const q = $('#q').value.trim();
  if (!q) return listAll();
  statusEl.textContent = 'Searching…';
  try {
    const r = await fetch('/v1/memories/search', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ query: q, user_id: uid, limit: 50 })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const items = results(await r.json());
    render(items, { scored: true });
    statusEl.textContent = `${items.length} results for “${esc(q)}” (user_id="${uid}")`;
  } catch (e) { statusEl.textContent = 'Error: ' + e.message; }
}

$('#go').onclick = search;
$('#all').onclick = () => { $('#q').value = ''; listAll(); };
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
listAll();
</script>
</body>
</html>
