apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mem0
resources:
  - namespace.yaml
  - postgres/pvc.yaml
  - postgres/secret.enc.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/backup-cronjob.yaml
  - qdrant/pvc.yaml
  - qdrant/statefulset.yaml
  - qdrant/service.yaml
  - qdrant/backup-cronjob.yaml
  - server/configmap.yaml
  - server/deployment.yaml
  - server/service.yaml
  - viewer/deployment.yaml
  - viewer/service.yaml
  # mcp/deployment.yaml — disabled, image does not exist yet
  # mcp/service.yaml

# Read-only web viewer UI + nginx proxy config (hash-suffixed -> edits roll the pod).
configMapGenerator:
  - name: mem0-viewer-web
    files:
      - viewer/index.html
      - viewer/default.conf
