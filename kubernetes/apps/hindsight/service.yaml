apiVersion: v1
kind: Service
metadata:
  name: hindsight
  namespace: hindsight
  labels: { app: hindsight }
spec:
  type: NodePort
  selector: { app: hindsight }
  ports:
    - { name: api, port: 8888, targetPort: 8888, nodePort: 30888 }  # REST API + MCP
    - { name: ui,  port: 9999, targetPort: 9999, nodePort: 30999 }  # control-plane UI
