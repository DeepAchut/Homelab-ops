# Daily logical backup of Hindsight's embedded postgres (pg0). pg0 binds
# 127.0.0.1 inside the pod (no Service), so we pg_dump via `kubectl exec` and
# stream the gzip to NFS (/mnt/pvedas/k8s-backups), which the Friday DAS->PBS
# job sweeps up. Mirrors the retired mem0 backup CronJobs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hindsight-backup
  namespace: hindsight
spec:
  schedule: "30 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: hindsight-backup
          restartPolicy: OnFailure
          containers:
            - name: pgdump
              image: bitnami/kubectl:1.31
              # NFS export is nobody-owned + no_root_squash — write as root.
              securityContext:
                runAsUser: 0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  TS=$(date +%Y%m%d-%H%M%S)
                  OUT="/backup/hindsight-postgres-${TS}.sql.gz"
                  echo "dumping hindsight postgres via kubectl exec -> $OUT"
                  kubectl exec deploy/hindsight -c hindsight -- sh -c 'PGD=$(find /home/hindsight/.pg0/installation -name pg_dump | head -1); PGPASSWORD=hindsight "$PGD" -h 127.0.0.1 -p 5432 -U hindsight -d hindsight --clean --if-exists --no-owner' | gzip > "$OUT"
                  SZ=$(stat -c%s "$OUT" 2>/dev/null || echo 0)
                  echo "wrote $OUT ($SZ bytes)"
                  [ "$SZ" -gt 1000 ] || { echo "X dump suspiciously small ($SZ bytes)"; exit 1; }
                  # retention: keep last 14
                  ls -1t /backup/hindsight-postgres-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
                  echo "OK"
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              nfs:
                server: 192.168.4.150
                path: /mnt/pvedas/k8s-backups
